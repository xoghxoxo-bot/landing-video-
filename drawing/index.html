<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BJJ ARTIST 드로잉 대기열</title>
<meta name="description" content="BJJ ARTIST 부스 라이브 초상화 드로잉 — 바로 신청하고 내 순번을 확인하세요">
<meta property="og:title" content="BJJ ARTIST 라이브 초상화 드로잉">
<meta property="og:description" content="이름만 입력하면 바로 대기열에 들어가요. 내 순번도 실시간으로 확인하세요.">
<meta name="theme-color" content="#0F1011">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* ==========================================================
   색상·글꼴 (여기 값만 바꾸면 전체 색이 바뀌어요)
   레이아웃: 휴대폰 한 손 기준 1단 — 인트로 → 현황 → 신청 버튼 → 내 순번 → 명단
   ========================================================== */
:root{
  /* 브랜드 무드: 차콜 + 골드 (행사장 어디서 봐도 같은 느낌이 나게 다크 하나로 고정) */
  --paper:#0E0F10; --surface:#18191B; --surface2:#212226; --ink:#EEEDE8; --muted:#8F9397; --line:#2B2D31;
  --accent:#D9AB5E; --accent-ink:#141516; --accent-soft:rgba(217,171,94,.13); --live:#FF5A4E; --warn:#F2A24A; --warn-soft:rgba(242,162,74,.13); --hit:rgba(217,171,94,.18); --ok:#4CC38A;
  --stage:#0A0A0B; --stage-ink:#F3F2EE; --gold:#D9AB5E;
  --display:'Bebas Neue','Arial Narrow',Impact,sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --r:18px; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(120% 55% at 50% -12%,rgba(217,171,94,.14),transparent 62%) fixed,var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;word-break:keep-all;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}

/* ---------- 인트로 (QR 찍고 처음 들어올 때) — 초상화가 선으로 그려지고, [입장하기]를 누르면 동그랗게 열려요 ---------- */
#intro{position:fixed;inset:0;z-index:50;background:radial-gradient(90% 60% at 50% 35%,#1b1712,var(--stage) 70%);color:var(--stage-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;
  clip-path:circle(150% at 50% 82%);transition:clip-path .85s cubic-bezier(.7,0,.2,1)}
#intro.leave{clip-path:circle(0% at 50% 82%)}
#intro .i-eye{font-family:var(--display);letter-spacing:.32em;font-size:15px;color:var(--gold);opacity:0;animation:fade .5s .05s forwards}
#intro .portrait{width:min(190px,48vw);height:auto;overflow:visible;filter:drop-shadow(0 0 18px rgba(217,171,94,.25))}
#intro .portrait path,#intro .portrait rect{fill:none;stroke:var(--gold);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s var(--d,0s) cubic-bezier(.5,0,.3,1) forwards}
#intro .portrait .frame{stroke:rgba(217,171,94,.45);stroke-width:1.4}
#intro .i-big{font-family:var(--display);font-size:clamp(54px,17vw,110px);line-height:.88;text-align:center;letter-spacing:.03em;display:flex;gap:.22em}
#intro .i-big span{display:inline-block;opacity:0;transform:translateY(45%);animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}
#intro .i-big span:last-child{color:var(--gold)}
#intro .i-sub{font-size:15px;opacity:0;animation:fade .5s 2.05s forwards;color:#B9BCBE}
#intro .i-sub b{font-family:var(--display);font-size:28px;color:var(--stage-ink);letter-spacing:.04em;margin:0 2px;vertical-align:-3px}
#intro .i-go{margin-top:6px;min-width:220px;min-height:58px;border:0;border-radius:999px;background:var(--gold);color:#141516;font-size:18px;font-weight:700;letter-spacing:.02em;
  opacity:0;transform:translateY(10px);animation:up .5s 2.25s forwards, ring 2.2s 3s ease-out infinite;position:relative;overflow:hidden}
#intro .i-go:active{transform:scale(.95)}
#intro .i-skip{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));background:none;border:0;color:#7d8184;font-size:13px;padding:8px}
@keyframes up{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(217,171,94,.55)}100%{box-shadow:0 0 0 18px rgba(217,171,94,0)}}

/* 본 화면이 처음 열릴 때 위에서부터 차례로 올라와요 */
#app.enter > *{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
#app.enter > *:nth-child(2){animation-delay:.06s}#app.enter > *:nth-child(3){animation-delay:.12s}#app.enter > *:nth-child(4){animation-delay:.18s}
#app.enter > *:nth-child(5){animation-delay:.24s}#app.enter > *:nth-child(6){animation-delay:.3s}#app.enter > *:nth-child(n+7){animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- 상단 ---------- */
.top{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--display);font-size:15px;letter-spacing:.14em;color:var(--accent)}
.top .mark{font-family:var(--display);font-size:clamp(52px,15vw,76px);line-height:.88;letter-spacing:.02em}
.top .mark span{color:var(--accent)}
.top h1{font-size:17px;font-weight:500;color:var(--muted);letter-spacing:-.01em;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;border:1px solid var(--line);background:var(--surface)}
.pill.break{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.pill.closed{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.pill.open .dot{background:var(--live);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.notice{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere}
.error{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 14px;font-weight:500}

/* 현황 두 칸 */
.stats{display:grid;grid-template-columns:1.35fr 1fr;gap:10px}
.stat{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat.live{border-color:rgba(255,90,78,.45);box-shadow:0 0 0 1px rgba(255,90,78,.12),0 10px 30px -12px rgba(255,90,78,.35)}
.stat .k{font-family:var(--display);font-size:14px;letter-spacing:.12em;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat.live .k{color:var(--live)}
.stat.live .k .dot{background:var(--live);animation:pulse 1.6s ease-in-out infinite}
.stat .v{font-size:24px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.stat .v.big{font-family:var(--display);font-size:48px;line-height:.95;letter-spacing:.02em}
.stat .v small{font-size:15px;font-weight:500;color:var(--muted);margin-left:3px;font-family:var(--body)}
.stat .v.idle{font-size:15px;font-weight:500;color:var(--muted)}
.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.12)}}

/* ---------- 버튼 (누르는 효과) ---------- */
.btn{position:relative;overflow:hidden;border:0;border-radius:14px;font-weight:700;transition:transform .12s ease,box-shadow .2s,background .2s;-webkit-user-select:none;user-select:none}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn .ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.cta{width:100%;min-height:64px;font-size:20px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.cta .arrow{font-family:var(--display);font-size:26px;transition:transform .2s}
.cta:hover .arrow{transform:translateX(4px)}
.cta.glow{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 8px 30px rgba(148,102,28,.45)}}
.cta-sub{text-align:center;color:var(--muted);font-size:13px;margin-top:-8px}
.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink);min-height:54px;padding:0 18px;font-size:15px;font-weight:700;flex:none}
.go{background:var(--accent);color:var(--accent-ink);min-height:54px;padding:0 20px;font-size:17px;flex:none}

/* ---------- 내 순번 ---------- */
.mine{background:radial-gradient(120% 90% at 50% 0%,rgba(217,171,94,.16),transparent 70%),var(--surface);border:1.5px solid var(--accent);box-shadow:0 14px 40px -18px rgba(217,171,94,.5);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.mine .who{font-size:15px;color:var(--muted);font-weight:500}
.mine .pos{font-size:22px;font-weight:700}
.mine .pos .n{font-family:var(--display);font-size:80px;line-height:.95;color:var(--accent);margin-right:4px;letter-spacing:.02em}
.mine .pos.word{font-size:26px;color:var(--accent);padding:6px 0}
.mine .sub{font-size:15px;font-weight:500}
.mine .forget{margin-top:8px;background:none;border:0;color:var(--muted);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}

.lookup{display:flex;flex-direction:column;gap:8px}
.lookup h2{font-size:16px}
.row-in{display:flex;gap:8px}
.row-in input{flex:1;min-width:0}
input[type=text]{border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:12px 14px;min-height:54px;font-size:17px;width:100%}
.lookres:empty{display:none}
.miss{color:var(--warn);font-size:14px;font-weight:500;padding:4px 2px}

/* ---------- 명단 ---------- */
.sec{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sechead h2{font-size:17px;font-weight:700}
.sechead .count{font-family:var(--display);font-size:22px;letter-spacing:.04em;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.item{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:4px 10px;padding:12px 14px 12px 8px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.me{background:var(--hit)}
.item .p{font-family:var(--display);font-size:30px;line-height:1;text-align:center}
.item.first .p{color:var(--accent)}
.item.first{background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}
.item .nm{min-width:0;display:flex;flex-direction:column;gap:3px}
.item .nm b{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;font-weight:500;padding:1px 7px;border-radius:5px;background:var(--paper);color:var(--muted)}
.tag.pre{color:var(--accent);background:var(--accent-soft)}
.tag.next{color:var(--accent);font-weight:700;background:none;padding:0;font-size:13px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.admin-list .item{grid-template-columns:56px 1fr;cursor:pointer}
.admin-list .nm{cursor:pointer}
.pick-btn{display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0 4px 4px;color:inherit}
.pick-btn .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;transition:background .15s,border-color .15s}
.pick-btn .p{font-family:var(--display);font-size:26px;line-height:1}
.item.sel{background:var(--hit)!important;box-shadow:inset 3px 0 0 var(--accent)}
.item.sel .ck{background:var(--accent);border-color:var(--accent)}
.item.sel .ck::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.b-next.picked{box-shadow:0 0 0 3px rgba(217,171,94,.35)}
.hint.pick{color:var(--accent)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:8px;align-items:center;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:rgba(14,15,16,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);animation:rise .25s both}
.selbar .b-next{flex:1;min-height:56px;font-size:16px;border-radius:14px}
.selbar .sm{min-height:56px;padding:0 16px}
.wrap:has(.selbar){padding-bottom:110px}
.hint.pick .linkbtn{color:var(--muted);margin-left:6px}
.admin-list .item .acts{grid-column:1 / -1;justify-content:flex-start;padding-left:6px;gap:5px}
.admin-list .sm{padding:0 10px;font-size:13.5px}
.sm.mv{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font-weight:500}
.emptybox{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted)}
.done{display:flex;flex-wrap:wrap;gap:6px}
.done span{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.guide{color:var(--muted);font-size:13.5px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:4px}
.foot{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12.5px}
.foot a{color:inherit}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.skeleton{color:var(--muted);text-align:center;padding:40px 0}

/* ---------- 신청 창 (아래에서 올라옴) ---------- */
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
#sheet .dim{position:absolute;inset:0;background:rgba(10,10,12,.5);opacity:0;transition:opacity .3s}
#sheet.open .dim{opacity:1}
#sheet .panel{position:relative;width:100%;max-width:560px;background:var(--surface);border-top:1px solid var(--line);border-radius:24px 24px 0 0;
  padding:12px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:16px;max-height:92vh;overflow:auto}
#sheet.open .panel{transform:none}
.grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{font-size:20px}
.x{background:none;border:0;font-size:26px;line-height:1;color:var(--muted);width:44px;height:44px}
#sheet-body{display:flex;flex-direction:column;gap:14px}
.count-now{background:radial-gradient(120% 120% at 100% 0%,rgba(217,171,94,.2),transparent 60%),var(--stage);border:1px solid var(--line);color:var(--stage-ink);border-radius:var(--r);padding:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.count-now .k{font-size:14px;color:#B9BCBE}
.count-now .v{font-family:var(--display);font-size:56px;line-height:.9;color:var(--gold)}
.count-now .v small{font-family:var(--body);font-size:16px;color:var(--stage-ink);margin-left:4px}
.hint{font-size:12.5px;color:var(--muted)}
.winner{display:flex;gap:12px;align-items:flex-start;margin-top:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface2);cursor:pointer;-webkit-user-select:none;user-select:none}
.winner input{position:absolute;opacity:0;width:1px;height:1px}
.winner .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;transition:background .15s,border-color .15s;margin-top:1px}
.winner input:checked + .box{background:var(--accent);border-color:var(--accent)}
.winner input:checked + .box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.winner input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.winner:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.winner .wt{display:flex;flex-direction:column;gap:2px}
.winner .wt b{font-size:16px}
.winner .wt small{font-size:12.5px;color:var(--muted);line-height:1.5}
.undo{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 14px;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);font-size:15px}
.undo .ic{font-size:20px;line-height:1}
.undo .lb{font-weight:500;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;text-align:left}
.notice-box{background:var(--warn-soft);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.6;display:flex;flex-direction:column;gap:2px}
.notice-box b:first-child{color:var(--warn);font-size:14px;margin-bottom:2px}
.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:10px 0}
.success svg{width:84px;height:84px}
.success circle{fill:none;stroke:var(--ok);stroke-width:5;stroke-dasharray:240;stroke-dashoffset:240;animation:draw .5s ease-out forwards}
.success polyline{fill:none;stroke:var(--ok);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70;animation:draw .35s .45s ease-out forwards}
.success .t1{font-size:17px;font-weight:500}
.success .t2{font-size:22px;font-weight:700}
.success .t2 .n{font-family:var(--display);font-size:64px;color:var(--accent);line-height:1;display:block}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes rot{to{transform:rotate(360deg)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* ---------- 관리자 ---------- */
.admin-bar{background:var(--stage);color:var(--stage-ink);border-radius:var(--r);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.admin-bar b{font-family:var(--display);letter-spacing:.14em;color:var(--gold);font-size:18px}
.admin-bar a{color:#B9BCBE;font-size:13px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.box h3{font-size:14px;color:var(--muted);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:15px;transition:transform .12s}
.seg button:active{transform:scale(.95)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.nowbox{border:1.5px solid var(--ink)}
.nowname{font-size:30px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.nowname.idle{font-size:16px;color:var(--muted);font-weight:500}
.two{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.two .btn{min-height:60px;font-size:16px}
.b-done{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.b-next{background:var(--accent);color:var(--accent-ink)}
.sm{min-height:40px;padding:0 12px;font-size:14px;border-radius:10px;font-weight:700}
.sm.start{background:var(--ink);color:var(--paper)}
.sm.del{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.sm.del.armed{background:var(--live);color:#fff;box-shadow:none}
.sm.back{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.kind{display:flex;gap:6px}
.kind button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:500}
.kind button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.reset-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sm.reset{min-height:48px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.sm.reset.armed{background:var(--live);color:#fff;box-shadow:none}
.pin{max-width:320px;width:100%;margin:40px auto 0;display:flex;flex-direction:column;gap:12px;text-align:center}
.pin input{text-align:center;letter-spacing:.4em;font-size:24px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;font-size:14px;z-index:70;box-shadow:0 6px 24px rgba(0,0,0,.2)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

  <button class="i-skip" type="button" data-intro="go">건너뛰기</button>

    <path pathLength="1" style="--d:.35s" d="M46 116 C40 66 78 34 112 38 C146 42 164 72 156 118"/>
    <path pathLength="1" style="--d:.6s" d="M100 52 C142 52 158 88 156 126 C154 168 130 196 100 196 C70 196 46 168 44 126 C42 88 60 52 100 52"/>

</div>

<main class="wrap" id="app"><div class="skeleton">불러오는 중이에요…</div></main>

<!-- ============ 신청 창 ============ -->
<div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="dim" data-close></div>
  <div class="panel">
    <div class="grip"></div>

    <div id="sheet-body"></div>
  </div>
</div>
<canvas id="confetti" hidden></canvas>

<script>
/* ==========================================================
   ★ 기본 설정 ★
   SHEET_ID   : 관리용 구글 시트 주소의 /d/ 와 /edit 사이 글자
   SCRIPT_URL : 구글 Apps Script 웹 앱 주소 (…/exec 로 끝나는 주소)
   REFRESH    : 손님 화면이 새 내용을 불러오는 간격(초)
   INSTA      : 맨 아래 인스타그램 주소
   ========================================================== */
var SHEET_ID   = '1ihX6Qh8EyIQo_t6FozAjjQpUcDyoV56COmy6MYyrbZo';
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7vq9yYkR-jBw8WUp5MHcQnfad-7VpxZYpuMLoTGppZ2OtNUWpJF9oCR7A1ip9s1V1/exec';
var REFRESH    = 15;
var INSTA      = 'https://www.instagram.com/bjj_artist/';

var IS_ADMIN = /[?&]admin\b/.test(location.search);
var app = document.getElementById('app');
var data = null, lastOk = 0, failed = false, prevWaiting = null;
var STATUS = {open:'진행 중','break':'잠시 쉬는 중',closed:'접수 마감'};
var STKEY  = {'진행중':'open','쉬는중':'break','마감':'closed'};

/* ---------- 작은 도구들 ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function hms(t){return new Date(t).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});}
function norm(s){return String(s||'').replace(/\s+/g,'').toLowerCase();}
function store(k,v){try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){}}
function load(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function toast(msg){
  var t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);}
  t.textContent=msg;t.hidden=false;clearTimeout(toast.tm);toast.tm=setTimeout(function(){t.hidden=true;},2600);
}
/* 버튼 누를 때 물결 효과 */
document.addEventListener('pointerdown',function(e){
  var b=e.target.closest('.btn'); if(!b||b.disabled) return;
  var r=b.getBoundingClientRect(), s=Math.max(r.width,r.height), sp=document.createElement('span');
  sp.className='ripple'; sp.style.width=sp.style.height=s+'px'; sp.style.left=(e.clientX-r.left-s/2)+'px'; sp.style.top=(e.clientY-r.top-s/2)+'px';
  b.appendChild(sp); setTimeout(function(){sp.remove();},650);
  if(navigator.vibrate) try{navigator.vibrate(8);}catch(x){}
});

/* JSONP 호출 (구글 시트·Apps Script 모두 로그인 없이 동작) */
function jsonp(url){
  return new Promise(function(resolve,reject){
    var cb='__j'+Date.now()+Math.floor(Math.random()*1e6), s=document.createElement('script');
    var isSheet=url.indexOf('/gviz/')>-1;
    var tm=setTimeout(function(){done();reject(new Error('timeout'));},20000);
    function done(){clearTimeout(tm);try{delete window[cb];}catch(e){window[cb]=undefined;}s.remove();}
    window[cb]=function(r){done();resolve(r);};
    s.onerror=function(){done();reject(new Error('load'));};
    s.src=url+(url.indexOf('?')>-1?'&':'?')+(isSheet?'tqx=out:json;responseHandler:'+cb:'callback='+cb)+'&_='+Date.now();
    document.head.appendChild(s);
  });
}
function api(params){
  if(!SCRIPT_URL) return Promise.reject(new Error('신청 기능이 아직 연결되지 않았어요'));
  var q=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');
  return jsonp(SCRIPT_URL+'?'+q).then(function(r){ if(!r||!r.ok){ var er=new Error((r&&r.error)||'처리하지 못했어요'); er.data=r; throw er; } return r; });
}

/* ---------- 시트 읽기 (손님 화면) ---------- */
function sheet(name,headers){
  return jsonp('https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?sheet='+encodeURIComponent(name)+'&headers='+headers)
    .then(function(r){ if(!r||r.status==='error') throw new Error('sheet'); return r.table; });
}
function cell(r,i){var c=r&&r.c&&r.c[i]; if(!c) return ''; return c.v==null?(c.f||''):String(c.v).trim();}
function shape(rows,status,notice){
  var current=rows.filter(function(p){return p.st==='그리는중';});
  var done=rows.filter(function(p){return p.st==='완료';});
  /* 대기 순서: 사전 당첨자가 항상 먼저, 그다음 현장 접수 (각각 시트 줄 순서) */
  var wait=rows.filter(function(p){return p.st==='대기'||!p.st;});
  var queue=wait.filter(function(p){return p.kind==='사전신청';}).concat(wait.filter(function(p){return p.kind!=='사전신청';}));
  var held=rows.filter(function(p){return p.st==='자리비움';});
  var noshow=rows.filter(function(p){return p.st==='불참';});
  return {rows:rows,current:current,done:done,queue:queue,held:held,noshow:noshow,status:STKEY[status]||'open',notice:notice||''};
}
function refresh(){
  return Promise.all([sheet('대기열',1),sheet('설정',0)]).then(function(t){
    var rows=(t[0].rows||[]).map(function(r){return{name:cell(r,0),st:cell(r,1)||'대기',kind:cell(r,2)};}).filter(function(p){return p.name&&p.name!=='이름';});
    var cfg={}; (t[1].rows||[]).forEach(function(r){cfg[cell(r,0)]=cell(r,1);});
    data=shape(rows,cfg['진행상태'],cfg['공지']); data.title=cfg['이벤트 이름']||'BJJ ARTIST 라이브 초상화 드로잉';
    lastOk=Date.now(); failed=false; renderGuest(); updateSheetCount();
  }).catch(function(){failed=true; renderGuest();});
}

/* 내 순번 계산 */
function findMe(name,kind){
  if(!data||!name) return null; var q=norm(name), i;
  /* 동명이인: 내가 신청한 구분(사전 당첨/현장)과 같은 사람을 먼저 찾아요 */
  if(kind) for(i=0;i<data.queue.length;i++) if(norm(data.queue[i].name)===q&&((data.queue[i].kind==='사전신청')===(kind==='사전신청'))) return {pos:i+1,name:data.queue[i].name};
  for(i=0;i<data.queue.length;i++) if(norm(data.queue[i].name)===q) return {pos:i+1,name:data.queue[i].name};
  if(data.current.some(function(p){return norm(p.name)===q;})) return {drawing:true,name:name};
  if(data.held.some(function(p){return norm(p.name)===q;})) return {hold:true,name:name};
  if(data.noshow.some(function(p){return norm(p.name)===q;})) return {noshow:true,name:name};
  if(data.done.some(function(p){return norm(p.name)===q;})) return {done:true,name:name};
  for(i=0;i<data.queue.length;i++) if(norm(data.queue[i].name).indexOf(q)>-1) return {pos:i+1,name:data.queue[i].name};
  return null;
}
function mineCard(m, forgettable){
  var h='<div class="mine" aria-live="polite">';
  if(m.pos){
    h+='<div class="who">'+esc(m.name)+' 님은</div><div class="pos"><span class="n num">'+m.pos+'</span>번째</div>';
    h+='<div class="sub">'+(m.pos===1?'다음 순서예요! 부스 앞에서 기다려 주세요':'앞에 '+(m.pos-1)+'명이 기다리고 있어요')+'</div>';
  } else if(m.drawing){
    h+='<div class="who">'+esc(m.name)+' 님</div><div class="pos word">지금 그리고 있어요!</div>';
  } else if(m.hold){
    h+='<div class="who">'+esc(m.name)+' 님</div><div class="pos word">잠시 자리 비움</div><div class="sub">부스로 오시면 사전 당첨자라 바로 우선 진행해요</div>';
  } else if(m.noshow){
    h+='<div class="who">'+esc(m.name)+' 님</div><div class="pos word">순서가 지나갔어요</div><div class="sub">호명 때 안 계셔서 다음 분이 먼저 진행했어요. 다시 신청하시면 맨 뒤로 들어가요.</div>';
  } else if(m.done){
    h+='<div class="who">'+esc(m.name)+' 님</div><div class="pos word">완료됐어요</div><div class="sub">참여해 주셔서 고마워요!</div>';
  }
  if(forgettable) h+='<button class="forget" type="button" data-act="forget">내 이름 지우기</button>';
  return h+'</div>';
}

/* ---------- 손님 화면 그리기 ---------- */
function renderGuest(){
  if(IS_ADMIN) return;
  if(!data){ app.innerHTML=failed?'<div class="error">순서를 불러오지 못했어요. 잠시 뒤 자동으로 다시 시도해요.</div>':'<div class="skeleton">불러오는 중이에요…</div>'; return; }
  var d=data, h='', myName=load('myName'), mine=findMe(myName,load('myKind'));
  var lookEl=document.getElementById('look'), lookVal=lookEl?lookEl.value:'';
  var lookRes=(document.getElementById('lookres')||{}).innerHTML||'';
  var focusLook=document.activeElement&&document.activeElement.id==='look';

  h+='<header class="top"><div class="eyebrow">BJJ ARTIST</div><div class="mark" aria-hidden="true">LIVE <span>DRAWING</span></div><h1>'+esc(d.title)+'</h1>';
  h+='<div class="meta"><span class="pill '+d.status+'"><span class="dot"></span>'+STATUS[d.status]+'</span><span class="num">'+hms(lastOk)+' 기준 · 자동 갱신</span></div></header>';
  if(failed) h+='<div class="error">연결이 잠깐 끊겼어요. 마지막으로 받은 순서를 보여주고 있어요.</div>';
  if(d.notice) h+='<div class="notice">'+esc(d.notice)+'</div>';

  h+='<div class="stats"><div class="stat'+(d.current.length?' live':'')+'"><div class="k"><span class="dot"></span>NOW DRAWING</div>';
  h+=d.current.length?'<div class="v">'+d.current.map(function(p){return esc(p.name);}).join(', ')+'<small>님</small></div>'
    :'<div class="v idle">'+(d.status==='closed'?'오늘 이벤트가 끝났어요':d.status==='break'?'잠시 쉬는 중이에요':'곧 시작해요')+'</div>';
  var bump=(prevWaiting!==null&&prevWaiting!==d.queue.length)?' bump':''; prevWaiting=d.queue.length;
  h+='</div><div class="stat"><div class="k">현재 대기</div><div class="v big num'+bump+'">'+d.queue.length+'<small>명</small></div></div></div>';

  if(mine) h+=mineCard(mine,true);

  if(d.status==='closed') h+='<button class="btn cta" type="button" disabled>오늘 접수가 마감됐어요</button>';
  else if(!(mine&&(mine.pos||mine.drawing||mine.hold))) h+='<button class="btn cta glow" type="button" data-act="open">지금 신청하기 <span class="arrow">→</span></button><div class="cta-sub">이름만 입력하면 바로 대기열에 들어가요</div>';

  h+='<section class="lookup"><h2>내 순번 조회</h2><div class="row-in"><input type="text" id="look" placeholder="신청한 이름" autocomplete="off" enterkeyhint="search" value="'+esc(lookVal)+'"><button class="btn ghost" type="button" data-act="look">조회</button></div><div class="lookres" id="lookres">'+lookRes+'</div></section>';

  h+='<section class="sec"><div class="sechead"><h2>대기 명단</h2><span class="count num">'+d.queue.length+'명</span></div>';
  if(!d.queue.length) h+='<div class="emptybox">지금은 대기자가 없어요. 바로 신청해 보세요!</div>';
  else{
    h+='<ol class="list">';
    d.queue.forEach(function(p,i){
      var me=mine&&mine.pos===i+1;
      h+='<li class="item'+(i===0?' first':'')+(me?' me':'')+'"><div class="p num">'+(i+1)+'</div><div class="nm"><b>'+esc(p.name)+'</b><div class="tags">'
        +(p.kind==='사전신청'?'<span class="tag pre">사전 당첨</span>':'<span class="tag">현장 접수</span>')+'</div></div>'
        +(i===0?'<span class="tag next">다음 순서</span>':'')+'</li>';
    });
    h+='</ol>';
  }
  if(d.held.length) h+='<div class="hint">사전 당첨자 '+d.held.length+'명이 잠시 자리를 비웠어요. 돌아오면 우선 진행돼서 현장 접수 순번이 그만큼 뒤로 밀릴 수 있어요.</div>';
  h+='</section>';
  if(d.done.length){
    h+='<section class="sec"><div class="sechead"><h2>완료</h2><span class="count num">'+d.done.length+'명</span></div><div class="done">';
    d.done.slice().reverse().forEach(function(p){h+='<span>'+esc(p.name)+'</span>';}); h+='</div></section>';
  }
  h+='<div class="guide"><div>· 초상화는 한 번에 한 분씩 그려요.</div><div>· 미리 당첨된 사전 당첨자 분들은 우선 진행돼요. 그래서 현장 접수 순번은 뒤로 밀릴 수 있어요.</div><div>· 호명했을 때 부스에 안 계시면 다음 분이 먼저 진행해요. 이때는 다시 신청하셔야 하고 순번은 맨 뒤로 가요.</div></div>';
  h+='<div class="foot"><a href="'+INSTA+'" target="_blank" rel="noopener">@bjj_artist</a><span>BJJ ARTIST</span></div>';
  app.innerHTML=h;
  if(focusLook){var li=document.getElementById('look'); li.focus(); try{li.setSelectionRange(li.value.length,li.value.length);}catch(e){}}
}

function doLookup(){
  var v=(document.getElementById('look').value||'').trim(), box=document.getElementById('lookres');
  if(!v){ box.innerHTML='<div class="miss">이름을 입력해 주세요</div>'; return; }
  var m=findMe(v);
  box.innerHTML=m?mineCard(m,false):'<div class="miss">명단에서 찾지 못했어요. 신청한 이름 그대로 입력하거나 부스에 문의해 주세요.</div>';
}

/* ---------- 신청 창 ---------- */
var sheetEl=document.getElementById('sheet'), sheetBody=document.getElementById('sheet-body'), busy=false;
function openSheet(){
  sheetBody.innerHTML='<div class="count-now"><div class="k">현재 대기 인원</div><div class="v num" id="sc">'+(data?data.queue.length:0)+'<small>명</small></div></div>'
    +'<form id="joinform" novalidate><div class="row-in"><input type="text" id="jname" maxlength="20" placeholder="이름 또는 닉네임" autocomplete="off" enterkeyhint="done"><button class="btn go" type="submit" id="jbtn">입력</button></div>'
    +'<label class="winner" for="jwin"><input type="checkbox" id="jwin"><span class="box" aria-hidden="true"></span><span class="wt"><b>사전 당첨자입니다</b><small>인스타 이벤트로 미리 당첨된 분만 체크해 주세요. 당첨 때 쓴 이름 그대로 입력하면 우선 순번으로 연결돼요.</small></span></label></form>'
    +'<div class="hint">입력한 이름은 대기 명단에 공개돼요. 닉네임도 괜찮아요.</div><div id="jmsg"></div>'
    +'<div class="notice-box"><b>신청 전에 꼭 읽어 주세요</b><div>· 호명했을 때 부스에 안 계시면 다음 분이 먼저 진행해요.</div><div>· 그 경우 다시 신청해 주셔야 하고, 순번은 <b>맨 뒤로</b> 가요.</div><div>· 미리 당첨된 사전 당첨자 분들이 우선 진행돼서 순번이 뒤로 밀릴 수 있어요.</div><div>· 사전 당첨자는 이름 칸 밑의 <b>사전 당첨자입니다</b>에 꼭 체크해 주세요.</div><div>양해 부탁드려요. 차례가 가까우면 부스 근처에 계셔 주세요!</div></div>';
  sheetEl.hidden=false; requestAnimationFrame(function(){requestAnimationFrame(function(){sheetEl.classList.add('open');});});
  setTimeout(function(){var i=document.getElementById('jname'); if(i) i.focus();},380);
  try{ history.pushState({sheet:1},''); }catch(e){}
}

/* 축하 효과 */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c=document.getElementById('confetti'), x=c.getContext('2d'), dpr=window.devicePixelRatio||1, W=c.width=innerWidth*dpr, H=c.height=innerHeight*dpr;
  c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px'; c.hidden=false;
  var cols=['#D9AB5E','#94661C','#D3372C','#ECEDEB','#1E7A4C'], ps=[];
  for(var i=0;i<90;i++) ps.push({x:W/2,y:H*0.55,vx:(Math.random()-.5)*W*0.03,vy:-Math.random()*H*0.028-H*0.01,s:(6+Math.random()*6)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%cols.length]});
  var t0=performance.now();
  (function f(t){ var k=(t-t0)/1000; x.clearRect(0,0,W,H);
    ps.forEach(function(p){p.vy+=H*0.0009;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-k/1.8);x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(k<1.8) requestAnimationFrame(f); else c.hidden=true; })(t0);
}

function playIntro(){
  var seen=false; try{seen=sessionStorage.getItem('intro')==='1';}catch(e){}
  if(seen||matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
  try{sessionStorage.setItem('intro','1');}catch(e){}
  var el=document.getElementById('intro'); el.hidden=false; document.body.style.overflow='hidden';
  /* 대기 인원 숫자가 0부터 올라가요 */
  var shown=0, tick=setInterval(function(){
    var target=data?data.queue.length:null; if(target==null) return;
    if(shown<target){ shown++; document.getElementById('i-cnt').textContent=shown; } else clearInterval(tick);
  },90);
  setTimeout(function(){ if(!data) return; }, 0);
  function leave(){
    if(el.classList.contains('leave')) return;
    clearInterval(tick); el.classList.add('leave'); document.body.style.overflow='';
    app.classList.add('enter'); setTimeout(function(){app.classList.remove('enter');},1400);
    setTimeout(function(){el.hidden=true;},900);
  }
  el.addEventListener('click',function(e){ if(e.target.closest('[data-intro]')) leave(); });
  setTimeout(leave,7000);   // 7초가 지나면 자동으로 들어가요
  return true;
}

    if(op==='noshow') adminDo({op:'noshow',row:row,name:nm},nm+' 님 없음 처리 — 다시 신청하면 맨 뒤');
    if(op==='return') adminDo({op:'return',row:row,name:nm},nm+' 님 대기로 돌아왔어요');
    if(op==='move'){ var dir=b.getAttribute('data-dir'); adminDo({op:'move',row:row,name:nm,dir:dir},nm+' 님 '+({up:'한 칸 위로',down:'한 칸 뒤로',top:'맨 앞으로'})[dir]); }
  });
  document.addEventListener('keydown',function(e){
    var t=e.target; if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')) return;
    if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&(e.key==='z'||e.key==='Z')&&A.state&&A.state.undo&&A.state.undo.count){ e.preventDefault(); adminDo({op:'undo'}); }
  });
  renderAdmin();
  if(A.pin) adminLoad().catch(function(){A.pin='';store('adminPin',null);renderAdmin();});
  setInterval(function(){ if(!document.hidden&&A.pin&&A.state&&!aBusy){ var a=document.activeElement; if(a&&(a.id==='addname'||a.id==='notice')&&a.value) return; adminLoad().catch(function(){}); } },8000);
}

/* ---------- 시작 ---------- */
if(IS_ADMIN) bindAdmin(); else { if(!playIntro()){ app.classList.add('enter'); setTimeout(function(){app.classList.remove('enter');},1400); } bindGuest(); }
</script>
</body>
</html>
