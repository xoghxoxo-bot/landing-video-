<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BJJ ARTIST 드로잉 대기열</title>
<meta name="description" content="BJJ ARTIST 부스 라이브 초상화 드로잉 실시간 대기 순서">
<meta property="og:title" content="BJJ ARTIST 라이브 초상화 드로잉">
<meta property="og:description" content="지금 누구를 그리고 있는지, 내 순서가 언제인지 실시간으로 확인하세요">
<meta name="theme-color" content="#F3F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1011" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* ==========================================================
   색상·글꼴 설정 (여기 값만 바꾸면 전체 색이 바뀌어요)
   ========================================================== */
:root{
  --paper:#F3F4F2; --surface:#FFFFFF; --ink:#141516; --muted:#676B6E; --line:#DCDEDA;
  --accent:#94661C; --accent-soft:#F2E8D5; --live:#D3372C; --warn:#A85A06; --warn-soft:#FBEBD5; --hit:#FFF3C4;
  --display:'Bebas Neue','Arial Narrow',Impact,sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0F1011; --surface:#1A1B1D; --ink:#ECEDEB; --muted:#9A9EA1; --line:#2C2E31;
  --accent:#D9AB5E; --accent-soft:#2E2617; --live:#FF5C50; --warn:#F2A24A; --warn-soft:#33250F; --hit:#3A3214; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;word-break:keep-all;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
#app,#top,#bottom{display:flex;flex-direction:column;gap:18px}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2{margin:0;text-wrap:balance}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--display);font-size:15px;letter-spacing:.14em;color:var(--accent)}
.top h1{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;border:1px solid var(--line);background:var(--surface)}
.pill.break{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.pill.closed{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.pill.open .dot{background:var(--live)}
.pill.open .dot,.now .dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.dot{animation:none!important}}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px;cursor:pointer}

.notice{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere}
.error{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 14px;font-weight:500}

.now{background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px}
.now .label{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:16px;letter-spacing:.12em;color:var(--live)}
.now .label .dot{background:var(--live)}
.now .who{font-size:34px;font-weight:700;line-height:1.2;letter-spacing:-.02em;overflow-wrap:anywhere}
.now .who small{font-size:18px;font-weight:500;color:var(--muted);margin-left:4px}
.now.empty{border-style:dashed;border-color:var(--line)}
.now.empty .label{color:var(--muted)}
.now.empty .label .dot{background:var(--muted);animation:none}
.now.empty .who{font-size:21px;color:var(--muted)}

.next{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;padding:0 2px}
.next b{font-size:18px}
.next span{color:var(--muted);font-size:14px}

.find{display:flex;flex-direction:column;gap:6px}
.find label{font-size:13px;font-weight:700;color:var(--muted)}
.find input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-height:46px;font-size:16px;width:100%}
.findres{font-size:14.5px;font-weight:500;min-height:1.5em}
.findres b{color:var(--accent)}

.sec{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sechead h2{font-size:17px;font-weight:700}
.sechead .count{font-family:var(--display);font-size:22px;letter-spacing:.04em;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:4px 10px;padding:12px 14px 12px 8px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.hit{background:var(--hit)}
.pos{font-family:var(--display);font-size:30px;line-height:1;text-align:center}
.row.first .pos{color:var(--accent)}
.name{min-width:0;display:flex;flex-direction:column;gap:3px}
.name b{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;font-weight:500;padding:1px 7px;border-radius:5px;background:var(--paper);color:var(--muted)}
.tag.pre{color:var(--accent);background:var(--accent-soft)}
.tag.away{color:var(--warn);background:var(--warn-soft);font-weight:700}
.eta{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.eta b{display:block;font-size:16px;color:var(--ink)}
.row.away .pos,.row.away .name b{opacity:.45}
.emptybox{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted)}

.done{display:flex;flex-wrap:wrap;gap:6px}
.done span{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}

.guide{color:var(--muted);font-size:13.5px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:4px}
.foot{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12.5px}
.foot a{color:inherit}
.skeleton{color:var(--muted);text-align:center;padding:40px 0}
</style>
</head>
<body>
<div id="app">
  <div id="top"><div class="skeleton">대기 순서를 불러오는 중이에요…</div></div>
  <div class="find" id="findbox" hidden><label for="q">내 순서 찾기</label><input id="q" type="search" placeholder="신청한 이름을 입력하세요" autocomplete="off" enterkeyhint="search"><div class="findres" id="findres" aria-live="polite"></div></div>
  <div id="bottom"></div>
</div>

<script>
/* ==========================================================
   ★ 기본 설정 ★
   SHEET_ID : 관리용 구글 시트 주소의 /d/ 와 /edit 사이 글자
   REFRESH  : 손님 화면이 새 내용을 불러오는 간격(초)
   INSTA    : 맨 아래 인스타그램 주소
   ========================================================== */
var SHEET_ID = '1ihX6Qh8EyIQo_t6FozAjjQpUcDyoV56COmy6MYyrbZo';
var REFRESH  = 20;
var INSTA    = 'https://www.instagram.com/bjj_artist/';

var app = document.getElementById('app');
var data = null, lastOk = 0, failed = false, query = '';
try { query = sessionStorage.getItem('q') || ''; } catch (e) {}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function hms(t){return new Date(t).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});}
function norm(s){return String(s||'').replace(/\s+/g,'').toLowerCase();}

/* 구글 시트 읽기 (로그인 없이 읽히도록 JSONP 방식) */
function loadSheet(sheet, headers){
  return new Promise(function(resolve, reject){
    var cb = '__s' + Date.now() + Math.floor(Math.random()*1e6);
    var s = document.createElement('script');
    var timer = setTimeout(function(){ done(); reject(new Error('timeout')); }, 15000);
    function done(){ clearTimeout(timer); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } s.remove(); }
    window[cb] = function(res){ done(); if(res && res.status !== 'error') resolve(res.table); else reject(new Error('sheet')); };
    s.onerror = function(){ done(); reject(new Error('load')); };
    s.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json;responseHandler:' + cb
          + '&sheet=' + encodeURIComponent(sheet) + '&headers=' + headers + '&_=' + Date.now();
    document.head.appendChild(s);
  });
}
function cell(r,i){ var c = r && r.c && r.c[i]; if(!c) return ''; return c.v==null ? (c.f||'') : String(c.v).trim(); }

function refresh(){
  return Promise.all([loadSheet('대기열',1), loadSheet('설정',0)]).then(function(t){
    var rows = (t[0].rows||[]).map(function(r){ return {name:cell(r,0), st:cell(r,1)||'대기', kind:cell(r,2)}; })
      .filter(function(p){ return p.name && p.name !== '이름'; });
    var cfg = {};
    (t[1].rows||[]).forEach(function(r){ cfg[cell(r,0)] = cell(r,1); });
    data = {
      rows: rows,
      status: ({'진행중':'open','쉬는중':'break','마감':'closed'})[cfg['진행상태']] || 'open',
      notice: cfg['공지'] || '',
      avg: parseInt(cfg['1인 평균(분)'],10) > 0 ? parseInt(cfg['1인 평균(분)'],10) : 15,
      title: cfg['이벤트 이름'] || 'BJJ ARTIST 라이브 초상화 드로잉'
    };
    lastOk = Date.now(); failed = false; render();
  }).catch(function(){ failed = true; render(); });
}

var STATUS = {open:'진행 중','break':'잠시 쉬는 중',closed:'접수 마감'};

function render(){
  var top = document.getElementById('top'), bottom = document.getElementById('bottom');
  if(!data){
    top.innerHTML = failed
      ? '<div class="error">대기 순서를 불러오지 못했어요. 잠시 뒤 자동으로 다시 시도해요.</div>'
      : '<div class="skeleton">대기 순서를 불러오는 중이에요…</div>';
    return;
  }
  var d = data, h = '';
  var current = d.rows.filter(function(p){ return p.st === '그리는중'; });
  var queue = d.rows.filter(function(p){ return p.st === '대기' || p.st === '시합중'; });
  var done = d.rows.filter(function(p){ return p.st === '완료'; });
  var activeIdx = 0, q = norm(query), hitText = '';

  h += '<header class="top"><div class="eyebrow">BJJ ARTIST · LIVE DRAWING</div><h1>' + esc(d.title) + '</h1>';
  h += '<div class="meta"><span class="pill ' + d.status + '"><span class="dot"></span>' + STATUS[d.status] + '</span>';
  h += '<span class="num">' + hms(lastOk) + ' 기준 · ' + REFRESH + '초마다 자동 갱신</span>';
  h += '<button class="linkbtn" id="reload" type="button">지금 새로고침</button></div></header>';
  if(failed) h += '<div class="error">연결이 잠깐 끊겼어요. 마지막으로 받은 순서를 보여주고 있어요.</div>';
  if(d.notice) h += '<div class="notice">' + esc(d.notice) + '</div>';

  if(current.length){
    h += '<section class="now" aria-live="polite"><div class="label"><span class="dot"></span>NOW DRAWING · 지금 그리는 중</div>';
    h += '<div class="who">' + current.map(function(p){return esc(p.name);}).join(', ') + '<small>님</small></div></section>';
  } else {
    var msg = d.status==='closed' ? '오늘 드로잉 이벤트가 끝났어요' : d.status==='break' ? '작가가 잠시 쉬는 중이에요' : '곧 다음 분을 그릴 예정이에요';
    h += '<section class="now empty"><div class="label"><span class="dot"></span>NOW DRAWING</div><div class="who">' + msg + '</div></section>';
  }

  var firstActive = queue.filter(function(p){ return p.st==='대기'; })[0];
  if(firstActive && d.status !== 'closed') h += '<div class="next"><span>다음 순서</span><b>' + esc(firstActive.name) + ' 님</b><span>부스 근처에서 기다려 주세요</span></div>';

  top.innerHTML = h; h = '';
  h += '<section class="sec"><div class="sechead"><h2>대기 명단</h2><span class="count num">' + queue.length + '명</span></div>';
  if(!queue.length){
    h += '<div class="emptybox">지금은 대기자가 없어요. 부스에서 바로 신청할 수 있어요.</div>';
  } else {
    h += '<ol class="list">';
    queue.forEach(function(p,i){
      var away = p.st === '시합중';
      var isHit = q && norm(p.name).indexOf(q) > -1;
      var eta = '';
      if(away) eta = '<div class="eta">매트에서<br>돌아오면 진행</div>';
      else if(d.status==='closed') eta = '<div class="eta">-</div>';
      else { var m = (current.length ? Math.round(d.avg/2) : 0) + activeIdx*d.avg; eta = '<div class="eta">예상 대기<b class="num">' + (m<=0 ? '곧 시작' : '약 ' + m + '분') + '</b></div>'; }
      if(isHit && !hitText) hitText = '<b>' + esc(p.name) + '</b> 님은 <b>' + (i+1) + '번째</b>예요' + (away ? ' (시합 중이라 순서를 지켜두고 있어요)' : (d.status!=='closed' ? ' · 예상 대기 약 ' + Math.max((current.length?Math.round(d.avg/2):0)+activeIdx*d.avg,0) + '분' : ''));
      h += '<li class="row' + (away?' away':'') + (!away && activeIdx===0 ? ' first':'') + (isHit?' hit':'') + '">';
      h += '<div class="pos num">' + (i+1) + '</div><div class="name"><b>' + esc(p.name) + '</b><div class="tags">'
         + (p.kind==='사전신청' ? '<span class="tag pre">사전 신청</span>' : '<span class="tag">현장 접수</span>')
         + (away ? '<span class="tag away">시합 중 · 순서 유지</span>' : '') + '</div></div>' + eta + '</li>';
      if(!away) activeIdx++;
    });
    h += '</ol>';
  }
  h += '</section>';

  if(q && !hitText){
    var c = current.some(function(p){return norm(p.name).indexOf(q)>-1;});
    var dn = done.some(function(p){return norm(p.name).indexOf(q)>-1;});
    hitText = c ? '지금 그리고 있어요!' : dn ? '이미 완료됐어요. 참여해 주셔서 고마워요!' : '명단에서 찾지 못했어요. 부스에 문의해 주세요.';
  }

  if(done.length){
    h += '<section class="sec"><div class="sechead"><h2>완료</h2><span class="count num">' + done.length + '명</span></div><div class="done">';
    done.slice().reverse().forEach(function(p){ h += '<span>' + esc(p.name) + '</span>'; });
    h += '</div></section>';
  }

  h += '<div class="guide"><div>· 초상화는 한 번에 한 분씩 그려요. 1인 약 ' + d.avg + '분 걸려요.</div><div>· 시합 호명을 받으면 다녀오세요. 순서는 그대로 유지돼요.</div><div>· 예상 시간은 대략이에요. 차례가 가까우면 부스 근처에 계셔 주세요.</div></div>';
  h += '<div class="foot"><a href="' + INSTA + '" target="_blank" rel="noopener">@bjj_artist</a><span>BJJ ARTIST</span></div>';

  bottom.innerHTML = h;
  document.getElementById('findbox').hidden = false;
  document.getElementById('findres').innerHTML = hitText;
}

var qInput = document.getElementById('q'); qInput.value = query;
qInput.addEventListener('input', function(e){
  if(e.isComposing) return;
  query = e.target.value; try{ sessionStorage.setItem('q', query); }catch(x){} render();
});
app.addEventListener('click', function(e){ if(e.target.id === 'reload') refresh(); });
qInput.addEventListener('compositionend', function(){ query = qInput.value; render(); });

refresh();
setInterval(function(){ if(!document.hidden) refresh(); }, REFRESH*1000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refresh(); });
</script>
</body>
</html>
